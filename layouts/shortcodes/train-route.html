{{- $route := index site.Data "train-route" -}}
{{- $stops := $route.stops -}}
{{- $current := $route.currentStopIndex -}}
<div class="train-route" role="img"
  aria-label="Train route: {{ range $index, $stop := $stops }}{{ if $index }}, {{ end }}{{ $stop.name }} at {{ $stop.time }}{{ if eq $index $current }} (current stop){{ end }}{{ end }}">
  <svg class="train-route__map" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <style>
      .train-route {
        box-sizing: border-box;
        width: 100%;
        margin: 1.5rem 0;
        padding: 1.5rem 1rem 0.75rem;
        overflow: hidden;
        border-radius: 0.5rem;
        background: #2e3440;
      }

      .train-route__map {
        display: block;
        width: 100%;
        height: auto;
        color: #d8dee9;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      }

      .train-route__line {
        stroke: #4c566a;
        stroke-width: 2.5;
      }

      .train-route__line--dashed {
        stroke-dasharray: 5 5;
      }

      .train-route__arrow {
        fill: none;
        stroke: #88c0d0;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .train-route__arrow--active {
        animation: train-route-arrow-move 2s infinite ease-in-out;
      }

      .train-route__dot {
        fill: #3b4252;
        stroke: #4c566a;
        stroke-width: 2;
      }

      .train-route__dot--completed {
        fill: #88c0d0;
        stroke: #88c0d0;
      }

      .train-route__dot--current {
        fill: #ebcb8b;
        stroke: #ebcb8b;
      }

      .train-route__pulse {
        fill: none;
        stroke: #ebcb8b;
        stroke-width: 2;
        animation: train-route-pulse 2s infinite ease-out;
      }

      .train-route__time {
        fill: #d8dee9;
        font-size: 12px;
        text-anchor: middle;
      }

      .train-route__name {
        fill: #d8dee9;
        font-size: 15px;
      }

      .train-route__name--current {
        fill: #ebcb8b;
        font-weight: 600;
      }

      @keyframes train-route-arrow-move {
        0% {
          transform: translateX(-15px);
          opacity: 0.3;
        }

        50% {
          opacity: 1;
        }

        100% {
          transform: translateX(15px);
          opacity: 0.3;
        }
      }

      @keyframes train-route-pulse {
        0% {
          r: 6px;
          opacity: 0.8;
        }

        100% {
          r: 20px;
          opacity: 0;
        }
      }

      @media (max-width: 480px) {
        .train-route {
          padding: 1rem 0.5rem 0.5rem;
        }

        .train-route__time {
          font-size: 11px;
        }

        .train-route__name {
          font-size: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {

        .train-route__arrow--active,
        .train-route__pulse {
          animation: none;
        }
      }
    </style>
    {{- $xStart := 72 -}}
    {{- $step := 114 -}}
    {{- $y := 50 -}}
    {{- range $index, $stop := $stops -}}
    {{- if lt $index (sub (len $stops) 1) -}}
    {{- $nextX := add $xStart (mul (add $index 1) $step) -}}
    {{- $x := add $xStart (mul $index $step) -}}
    <line
      class="train-route__line{{ if or (eq $index 0) (eq $index (sub (len $stops) 2)) }} train-route__line--dashed{{ end }}"
      x1="{{ $x }}" y1="{{ $y }}" x2="{{ $nextX }}" y2="{{ $y }}" />
    {{- end -}}
    {{- end -}}
    {{- if gt $current 0 -}}
    {{- $arrowX := add $xStart (mul $current $step) -}}
    {{- $arrowX = sub $arrowX (div $step 2) -}}
    <polyline class="train-route__arrow train-route__arrow--active"
      points="{{ sub $arrowX 6 }},{{ sub $y 6 }} {{ add $arrowX 6 }},{{ $y }} {{ sub $arrowX 6 }},{{ add $y 6 }}" />
    {{- end -}}
    {{- range $index, $stop := $stops -}}
    {{- $x := add $xStart (mul $index $step) -}}
    {{- if eq $index $current }}
    <circle class="train-route__pulse" cx="{{ $x }}" cy="{{ $y }}" r="20" />{{ end -}}
    <circle
      class="train-route__dot{{ if lt $index $current }} train-route__dot--completed{{ else if eq $index $current }} train-route__dot--current{{ end }}"
      cx="{{ $x }}" cy="{{ $y }}" r="8" />
    <text class="train-route__time" x="{{ $x }}" y="{{ sub $y 16 }}">{{ $stop.time }}</text>
    {{- $textX := sub $x 5 -}}
    {{- $textY := add $y 28 -}}
    <text class="train-route__name{{ if eq $index $current }} train-route__name--current{{ end }}" x="{{ $textX }}"
      y="{{ $textY }}" transform="rotate(30 {{ $textX }} {{ $textY }})">{{ $stop.name }}</text>
    {{- end }}
  </svg>
</div>
